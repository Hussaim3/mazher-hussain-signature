  <script>
    async function copyLiveSignature(htmlString, fallbackId, btn) {
      const orig = btn.textContent;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          const htmlBlob = new Blob([htmlString], { type: 'text/html' });
          const textBlob = new Blob(['Mazher Hussain | Quality Assurance Leader | +64 21 184 2439 | mazher.khaja313@outlook.co.nz'], { type: 'text/plain' });
          await navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob })]);
          btn.textContent = 'Copied! Paste in Outlook / Gmail';
          btn.style.background = '#059669';
          setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 2200);
          return;
        }
      } catch (err) {}
      const el = document.getElementById(fallbackId);
      if (el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges();
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 2000);
      }
    }
    async function copyRawHtml(htmlString, btn) {
      const orig = btn.textContent;
      try {
        await navigator.clipboard.writeText(htmlString);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = htmlString;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      btn.textContent = 'HTML Copied!';
      setTimeout(() => { btn.textContent = orig; }, 2000);
    }
